<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px; line-height: 1.65; }
    h1 { font-size: 26px; font-weight: 500; margin-bottom: 8px; }
    h2 { font-size: 16px; font-weight: 500; }
  </style>
</head>
<body>
  <h1>Quick Translate</h1>
  <p>英文阅读，随选随译。</p>
  <h2>选中文字，按 Option + D</h2>
  <p>在简洁的浮窗中对照英文和中文，读完点击窗口外即可收起。</p>
  <p>安装器会将 Quick Translate 放入“应用程序”文件夹。<br>
  点击“继续”，按提示完成安装。更新前请先退出正在运行的 Quick Translate。</p>
  <p>适用于 Apple Silicon（M 系列）Mac，macOS 13 或更高版本。<br>
  首次使用时，需要填写自己的大模型 API 配置并开启辅助功能权限。</p>
</body>
</html>
