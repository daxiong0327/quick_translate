<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px; line-height: 1.65; }
    h1 { font-size: 22px; font-weight: 500; }
    li { margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>开始使用 Quick Translate</h1>
  <ol>
    <li>从“应用程序”打开 <b>Quick Translate</b>，点击菜单栏的 <b>qt</b> 进入设置，填写自己的接口地址、模型和 API Key。</li>
    <li>在“系统设置 → 隐私与安全性 → 辅助功能”中添加并启用 Quick Translate。</li>
    <li>在其他应用选中英文，按 <b>Option + D</b> 查看译文。</li>
  </ol>
  <p>首次打开若被系统拦截，请确认安装包来自本项目，再在“系统设置 → 隐私与安全性”中选择“仍要打开”。本预览版未经过 Apple 公证。</p>
</body>
</html>
